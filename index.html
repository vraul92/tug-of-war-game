<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUG — Work Meeting Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
  :root {
    --teal: #3ABFB0;
    --teal-dark: #2a9d8f;
    --blue-player: #4AB4E8;
    --red-player: #F05C5C;
    --mid-zone: #2D5F7A;
    --rope: #D4893A;
    --skin: #F5C998;
    --black: #1a1a1a;
    --white: #FFFFFF;
    --yellow: #F7D44C;
    --score-bg: rgba(0,0,0,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a2a2a;
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ── SCREENS ── */
  .screen { display: none; width: 100vw; min-height: 100vh; align-items: center; justify-content: center; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── SETUP SCREEN ── */
  #setup {
    background: var(--teal);
    gap: 0;
  }
  .setup-card {
    background: white;
    border-radius: 32px;
    padding: 48px 40px;
    width: min(440px, 92vw);
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .setup-card h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.2rem;
    letter-spacing: 3px;
    color: var(--black);
    text-align: center;
    line-height: 1;
  }
  .setup-card h1 span { color: var(--teal-dark); }
  .setup-card p {
    text-align: center;
    color: #666;
    font-size: 0.95rem;
    font-weight: 700;
    margin-top: -12px;
  }
  .field-group { display: flex; flex-direction: column; gap: 8px; }
  .field-group label {
    font-weight: 800;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #555;
  }
  .field-group input, .field-group select {
    padding: 14px 18px;
    border-radius: 14px;
    border: 2.5px solid #eee;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--black);
    outline: none;
    transition: border-color 0.2s;
  }
  .field-group input:focus, .field-group select:focus { border-color: var(--teal); }

  .role-picker {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .role-btn {
    padding: 16px;
    border-radius: 16px;
    border: 3px solid #eee;
    background: white;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    transition: all 0.18s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .role-btn .avatar { font-size: 2rem; }
  .role-btn.blue { border-color: var(--blue-player); background: #e8f6fd; color: #1a80b8; }
  .role-btn.red  { border-color: var(--red-player);  background: #fdeaea; color: #c0392b; }
  .role-btn:not(.blue):not(.red):hover { border-color: #ccc; background: #f9f9f9; }

  .join-btn {
    padding: 18px;
    border-radius: 16px;
    border: none;
    background: var(--teal-dark);
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    box-shadow: 0 6px 20px rgba(42,157,143,0.4);
  }
  .join-btn:hover { transform: translateY(-2px); background: #238c7e; }
  .join-btn:active { transform: translateY(1px); }

  .status-msg {
    text-align: center;
    font-weight: 700;
    font-size: 0.9rem;
    color: #888;
    min-height: 20px;
  }
  .status-msg.error { color: #e74c3c; }
  .status-msg.ok    { color: var(--teal-dark); }

  /* ── LOBBY SCREEN ── */
  #lobby {
    background: var(--teal);
    gap: 20px;
  }
  .lobby-card {
    background: white;
    border-radius: 32px;
    padding: 48px 40px;
    width: min(400px, 92vw);
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
  }
  .lobby-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; letter-spacing: 2px; }
  .player-slots { display: flex; gap: 16px; width: 100%; }
  .slot {
    flex: 1;
    padding: 20px 12px;
    border-radius: 18px;
    border: 3px dashed #ddd;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
  }
  .slot .dot { width: 14px; height: 14px; border-radius: 50%; background: #ddd; }
  .slot.filled { border-style: solid; }
  .slot.filled.blue { border-color: var(--blue-player); background: #e8f6fd; }
  .slot.filled.red  { border-color: var(--red-player);  background: #fdeaea; }
  .slot.filled .dot.blue { background: var(--blue-player); }
  .slot.filled .dot.red  { background: var(--red-player); }
  .slot .slot-name { font-weight: 800; font-size: 0.9rem; color: #333; }
  .slot .slot-role { font-size: 0.75rem; color: #999; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .room-code {
    background: #f5f5f5;
    border-radius: 14px;
    padding: 14px 24px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 6px;
    color: var(--black);
    user-select: all;
    cursor: pointer;
  }
  .room-code-label { font-size: 0.78rem; font-weight: 800; color: #aaa; text-transform: uppercase; letter-spacing: 1px; margin-bottom: -12px; }
  .waiting-dots span {
    display: inline-block;
    animation: bounce 1.2s infinite;
    font-size: 1.8rem;
  }
  .waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
  .waiting-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-10px)} }

  /* ── GAME SCREEN ── */
  #game {
    background: var(--teal);
    position: relative;
    flex-direction: column;
    gap: 0;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }

  .game-wrap {
    position: relative;
    width: min(420px, 100vw);
    height: 100vh;
    max-height: 860px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Score bars top/bottom */
  .score-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 10px;
    flex-shrink: 0;
    z-index: 10;
  }
  .score-bar.bottom { padding: 10px 20px 16px; transform: rotate(180deg); }

  .player-badge {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .badge-circle {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: white;
    flex-shrink: 0;
  }
  .badge-circle.blue { background: var(--blue-player); border-color: #88d0f5; }
  .badge-circle.red  { background: var(--red-player);  border-color: #f99; }

  .badge-info { display: flex; flex-direction: column; }
  .badge-name { font-weight: 900; font-size: 0.9rem; color: white; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
  .badge-stats { font-size: 0.72rem; font-weight: 700; color: rgba(255,255,255,0.8); }

  .round-wins {
    display: flex;
    gap: 6px;
  }
  .win-pip {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.4);
    transition: all 0.3s;
  }
  .win-pip.filled { background: var(--yellow); border-color: #e6c000; }

  /* Arena */
  .arena {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .field-top {
    flex: 1;
    background: var(--teal);
    position: relative;
  }
  .field-bottom {
    flex: 1;
    background: var(--teal);
    position: relative;
  }
  .mid-zone {
    height: 80px;
    background: var(--mid-zone);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mid-line-white {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: white;
    opacity: 0.6;
  }
  .mid-line-white.bottom { top: auto; bottom: 0; }

  /* Rope anchor diamond */
  .anchor {
    width: 36px; height: 36px;
    background: var(--yellow);
    transform: rotate(45deg);
    position: absolute;
    left: 50%;
    top: 50%;
    margin-left: -18px;
    margin-top: -18px;
    z-index: 5;
    transition: left 0.05s linear;
    box-shadow: 0 0 0 4px var(--black), 0 4px 12px rgba(0,0,0,0.4);
  }

  /* Timer in mid zone */
  .timer-display {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    color: white;
    letter-spacing: 0;
    z-index: 10;
  }
  .timer-display.urgent { color: #ff6b6b; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0%,100%{transform:translateY(-50%) scale(1)} 50%{transform:translateY(-50%) scale(1.15)} }

  /* Characters */
  .character {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 72px;
    transition: top 0.08s linear, bottom 0.08s linear;
    z-index: 8;
  }
  .char-blue { bottom: 0; }
  .char-red  { top: 0; transform: translateX(-50%) rotate(180deg); }

  /* SVG character */
  .char-svg { width: 72px; height: 90px; }

  /* Rope */
  .rope-svg {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    z-index: 7;
    pointer-events: none;
  }

  /* Hit flash */
  .hit-flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 20;
    transition: opacity 0.05s;
  }
  .hit-flash.blue-flash { background: radial-gradient(circle at 50% 100%, rgba(74,180,232,0.35), transparent 60%); }
  .hit-flash.red-flash  { background: radial-gradient(circle at 50% 0%,   rgba(240,92,92,0.35),  transparent 60%); }
  .hit-flash.show { opacity: 1; }

  /* Tap zone */
  .tap-zone {
    position: absolute;
    inset: 0;
    cursor: pointer;
    z-index: 15;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 16px;
  }
  .tap-zone.top-zone { align-items: flex-start; padding-bottom: 0; padding-top: 16px; }

  .tap-hint {
    background: rgba(0,0,0,0.15);
    border-radius: 14px;
    padding: 8px 20px;
    font-weight: 800;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  /* Overlay messages */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 50;
    gap: 16px;
  }
  .overlay.hidden { display: none; }

  .overlay-card {
    background: white;
    border-radius: 28px;
    padding: 40px 48px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    max-width: 320px;
    width: 90%;
  }
  .overlay-emoji { font-size: 3.5rem; line-height: 1; }
  .overlay-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.6rem;
    letter-spacing: 2px;
    line-height: 1;
    color: var(--black);
  }
  .overlay-sub { font-weight: 700; color: #777; font-size: 0.95rem; }
  .overlay-btn {
    margin-top: 4px;
    padding: 14px 32px;
    border-radius: 14px;
    border: none;
    background: var(--teal-dark);
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: transform 0.15s;
    box-shadow: 0 4px 16px rgba(42,157,143,0.4);
  }
  .overlay-btn:hover { transform: translateY(-2px); }

  /* Countdown */
  .countdown-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 8rem;
    color: white;
    text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    line-height: 1;
    animation: countPop 0.4s ease-out;
  }
  @keyframes countPop { from{transform:scale(1.6); opacity:0} to{transform:scale(1); opacity:1} }

  /* Win banner color */
  .overlay-title.blue { color: var(--blue-player); }
  .overlay-title.red  { color: var(--red-player); }

  /* Match win pips in overlay */
  .match-pips { display: flex; gap: 8px; }
  .match-pip {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #eee;
    border: 2.5px solid #ddd;
    transition: all 0.4s;
  }
  .match-pip.blue { background: var(--blue-player); border-color: #1a80b8; }
  .match-pip.red  { background: var(--red-player);  border-color: #c0392b; }

  /* Disconnect notice */
  .disconnect-banner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #333;
    color: white;
    border-radius: 14px;
    padding: 16px 28px;
    font-weight: 800;
    font-size: 0.9rem;
    z-index: 60;
    display: none;
    text-align: center;
  }

  /* Responsive */
  @media (max-height: 700px) {
    .game-wrap { max-height: 100vh; }
    .badge-circle { width: 42px; height: 42px; font-size: 1.2rem; }
  }

  /* Mobile tap button */
  .mobile-tap-btn {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 2px;
    color: white;
    cursor: pointer;
    z-index: 30;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transition: transform 0.1s;
  }
  .mobile-tap-btn:active { transform: translateX(-50%) scale(0.93); }
  @media (hover: none) { .mobile-tap-btn { display: flex; align-items: center; justify-content: center; } }
</style>
</head>
<body>

<!-- ══ SETUP SCREEN ══ -->
<div id="setup" class="screen active">
  <div class="setup-card">
    <h1>TUG<span>.</span></h1>
    <p>Work Meeting Edition 🏆</p>

    <div class="field-group">
      <label>Your Name</label>
      <input id="playerName" type="text" placeholder="Enter your name" maxlength="16" autocomplete="off" />
    </div>

    <div class="field-group">
      <label>Room Code (share with opponent)</label>
      <input id="roomCode" type="text" placeholder="e.g. WORK42" maxlength="12"
             autocomplete="off" style="text-transform:uppercase;letter-spacing:2px;" />
    </div>

    <div class="field-group">
      <label>Pick Your Side</label>
      <div class="role-picker">
        <button class="role-btn blue" id="btnBlue" onclick="selectRole('blue')">
          <span class="avatar">🔵</span>
          <span>BLUE</span>
          <span style="font-size:0.72rem;opacity:0.7">Top</span>
        </button>
        <button class="role-btn red" id="btnRed" onclick="selectRole('red')">
          <span class="avatar">🔴</span>
          <span>RED</span>
          <span style="font-size:0.72rem;opacity:0.7">Bottom</span>
        </button>
      </div>
    </div>

    <div class="field-group">
      <label>Ably API Key</label>
      <input id="ablyKey" type="password" placeholder="Paste your Ably API key" autocomplete="off" />
    </div>

    <button class="join-btn" onclick="joinRoom()">JOIN ROOM →</button>
    <div class="status-msg" id="setupStatus">Enter details above and join</div>
  </div>
</div>

<!-- ══ LOBBY SCREEN ══ -->
<div id="lobby" class="screen">
  <div class="lobby-card">
    <h2>Waiting for opponent…</h2>
    <div class="player-slots">
      <div class="slot" id="slotBlue">
        <div class="dot"></div>
        <span class="slot-name">—</span>
        <span class="slot-role">Blue</span>
      </div>
      <div class="slot" id="slotRed">
        <div class="dot"></div>
        <span class="slot-name">—</span>
        <span class="slot-role">Red</span>
      </div>
    </div>
    <div>
      <div class="room-code-label">Room Code</div>
      <div class="room-code" id="displayCode" onclick="copyCode()">——</div>
    </div>
    <div class="waiting-dots"><span>·</span><span>·</span><span>·</span></div>
    <div class="status-msg" id="lobbyStatus">Share the room code with your opponent</div>
  </div>
</div>

<!-- ══ GAME SCREEN ══ -->
<div id="game" class="screen">
  <div class="game-wrap" id="gameWrap">

    <!-- Blue top score bar -->
    <div class="score-bar" id="scoreBarBlue">
      <div class="player-badge">
        <div class="badge-circle blue" id="scoreBlue">0</div>
        <div class="badge-info">
          <span class="badge-name" id="nameBlue">Blue</span>
          <span class="badge-stats" id="statsBlue">0 hits · 0/s</span>
        </div>
      </div>
      <div class="round-wins" id="winsBlue"></div>
    </div>

    <!-- Arena -->
    <div class="arena" id="arena">
      <!-- Top field (blue) -->
      <div class="field-top" id="fieldTop">
        <div class="hit-flash blue-flash" id="flashBlue"></div>
        <!-- Blue character sits here, positioned by JS -->
      </div>

      <!-- Mid zone -->
      <div class="mid-zone">
        <div class="mid-line-white"></div>
        <div class="anchor" id="anchor"></div>
        <div class="timer-display" id="timerDisplay">—</div>
        <div class="mid-line-white bottom"></div>
      </div>

      <!-- Bottom field (red) -->
      <div class="field-bottom" id="fieldBottom">
        <div class="hit-flash red-flash" id="flashRed"></div>
      </div>

      <!-- SVG Rope rendered in JS -->
      <svg class="rope-svg" id="ropeSvg" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Characters -->
      <div class="character char-blue" id="charBlue">
        <svg class="char-svg" viewBox="0 0 72 90" xmlns="http://www.w3.org/2000/svg">
          <!-- body -->
          <ellipse cx="36" cy="52" rx="20" ry="22" fill="#4AB4E8" stroke="#1a1a1a" stroke-width="4"/>
          <!-- head -->
          <circle cx="36" cy="24" r="18" fill="#F5C998" stroke="#1a1a1a" stroke-width="4"/>
          <!-- hair -->
          <path d="M18 20 Q36 2 54 20 Q50 8 36 6 Q22 8 18 20Z" fill="#1a1a1a"/>
          <!-- eyes -->
          <ellipse cx="29" cy="24" rx="3" ry="3.5" fill="#1a1a1a"/>
          <ellipse cx="43" cy="24" rx="3" ry="3.5" fill="#1a1a1a"/>
          <!-- arms -->
          <ellipse cx="14" cy="55" rx="7" ry="9" fill="#F5C998" stroke="#1a1a1a" stroke-width="3" transform="rotate(-15 14 55)"/>
          <ellipse cx="58" cy="55" rx="7" ry="9" fill="#F5C998" stroke="#1a1a1a" stroke-width="3" transform="rotate(15 58 55)"/>
          <!-- hands on rope -->
          <circle cx="36" cy="74" r="7" fill="#F5C998" stroke="#1a1a1a" stroke-width="3"/>
        </svg>
      </div>

      <div class="character char-red" id="charRed">
        <svg class="char-svg" viewBox="0 0 72 90" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="36" cy="52" rx="20" ry="22" fill="#F05C5C" stroke="#1a1a1a" stroke-width="4"/>
          <circle cx="36" cy="24" r="18" fill="#F5C998" stroke="#1a1a1a" stroke-width="4"/>
          <path d="M18 20 Q36 2 54 20 Q50 8 36 6 Q22 8 18 20Z" fill="#1a1a1a"/>
          <ellipse cx="29" cy="24" rx="3" ry="3.5" fill="#1a1a1a"/>
          <ellipse cx="43" cy="24" rx="3" ry="3.5" fill="#1a1a1a"/>
          <ellipse cx="14" cy="55" rx="7" ry="9" fill="#F5C998" stroke="#1a1a1a" stroke-width="3" transform="rotate(-15 14 55)"/>
          <ellipse cx="58" cy="55" rx="7" ry="9" fill="#F5C998" stroke="#1a1a1a" stroke-width="3" transform="rotate(15 58 55)"/>
          <circle cx="36" cy="74" r="7" fill="#F5C998" stroke="#1a1a1a" stroke-width="3"/>
        </svg>
      </div>

      <!-- Overlays -->
      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <div class="overlay-emoji" id="overlayEmoji">🏆</div>
          <div class="overlay-title" id="overlayTitle">BLUE WINS</div>
          <div class="match-pips" id="matchPips"></div>
          <div class="overlay-sub" id="overlaySub">Round 1 complete</div>
          <button class="overlay-btn" id="overlayBtn" onclick="overlayAction()">NEXT ROUND</button>
        </div>
      </div>

      <div class="overlay hidden" id="countdownOverlay">
        <div class="countdown-big" id="countdownNum">3</div>
      </div>

      <div class="disconnect-banner" id="disconnectBanner">⚡ Opponent disconnected</div>
    </div>

    <!-- Red bottom score bar -->
    <div class="score-bar bottom" id="scoreBarRed">
      <div class="player-badge">
        <div class="badge-circle red" id="scoreRed">0</div>
        <div class="badge-info">
          <span class="badge-name" id="nameRed">Red</span>
          <span class="badge-stats" id="statsRed">0 hits · 0/s</span>
        </div>
      </div>
      <div class="round-wins" id="winsRed"></div>
    </div>

    <!-- Mobile tap button -->
    <button class="mobile-tap-btn" id="mobileTapBtn" style="display:none"></button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  CONFIG & STATE
// ═══════════════════════════════════════════════════
const ROUND_DURATION = 30;   // seconds
const ROPE_MAX       = 42;   // % offset each side can pull (total range = 84%)
const PULL_STEP      = 0.6;  // % rope moves per hit
const ROUNDS_TO_WIN  = 3;    // first to 3 round wins

let ably, channel;
let myRole   = null;   // 'blue' | 'red'
let myName   = '';
let roomCode = '';

// Shared game state (host = blue drives the clock & physics)
let state = {
  ropePos: 0,      // -ROPE_MAX..+ROPE_MAX (negative = blue winning, positive = red winning)
  blueHits: 0,
  redHits: 0,
  blueWins: 0,
  redWins: 0,
  phase: 'waiting', // waiting | countdown | playing | roundEnd | matchEnd
  timer: ROUND_DURATION,
  round: 1
};

// Local hit tracking for rate calc
let localHitsThisSecond = 0;
let localHitRate = 0;
let lastHitTime  = 0;
let hitRateWindow = [];
let roundStartTime = 0;

let timerInterval = null;
let lobbyState = { blue: null, red: null };

// ═══════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setStatus(id, msg, cls='') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'status-msg ' + cls;
}

function selectRole(role) {
  myRole = role;
  document.getElementById('btnBlue').style.opacity = role === 'blue' ? '1' : '0.45';
  document.getElementById('btnRed').style.opacity  = role === 'red'  ? '1' : '0.45';
}
selectRole('blue'); // default

// ═══════════════════════════════════════════════════
//  JOIN / ABLY SETUP
// ═══════════════════════════════════════════════════
async function joinRoom() {
  const name = document.getElementById('playerName').value.trim();
  const code = document.getElementById('roomCode').value.trim().toUpperCase();
  const key  = document.getElementById('ablyKey').value.trim();

  if (!name) return setStatus('setupStatus', '⚠ Enter your name', 'error');
  if (!code) return setStatus('setupStatus', '⚠ Enter a room code', 'error');
  if (!key)  return setStatus('setupStatus', '⚠ Paste your Ably API key', 'error');

  myName   = name;
  roomCode = code;

  setStatus('setupStatus', 'Connecting…');

  try {
    ably    = new Ably.Realtime({ key });
    channel = ably.channels.get('tug-' + code);

    ably.connection.on('connected', () => {
      setStatus('setupStatus', 'Connected ✓', 'ok');
      enterLobby();
    });
    ably.connection.on('failed', () => setStatus('setupStatus', '✗ Connection failed — check API key', 'error'));
    ably.connection.on('disconnected', () => {
      document.getElementById('disconnectBanner').style.display = 'block';
    });
  } catch(e) {
    setStatus('setupStatus', '✗ Error: ' + e.message, 'error');
  }
}

// ═══════════════════════════════════════════════════
//  LOBBY
// ═══════════════════════════════════════════════════
function enterLobby() {
  showScreen('lobby');
  document.getElementById('displayCode').textContent = roomCode;

  // Subscribe to lobby presence
  channel.subscribe('lobby', handleLobbyMsg);
  channel.subscribe('gameMsg', handleGameMsg);

  // Announce myself
  publishLobby();
}

function publishLobby() {
  channel.publish('lobby', { role: myRole, name: myName });
}

function handleLobbyMsg(msg) {
  const { role, name } = msg.data;
  lobbyState[role] = name;
  updateLobbyUI();
}

function updateLobbyUI() {
  ['blue','red'].forEach(r => {
    const slot = document.getElementById('slot' + r.charAt(0).toUpperCase() + r.slice(1));
    const n = lobbyState[r];
    if (n) {
      slot.className = `slot filled ${r}`;
      slot.querySelector('.dot').className = `dot ${r}`;
      slot.querySelector('.slot-name').textContent = n;
    } else {
      slot.className = 'slot';
      slot.querySelector('.dot').className = 'dot';
      slot.querySelector('.slot-name').textContent = '—';
    }
  });

  if (lobbyState.blue && lobbyState.red) {
    setStatus('lobbyStatus', 'Both players ready! Starting…', 'ok');
    setTimeout(startGame, 1200);
  }
}

function copyCode() {
  navigator.clipboard?.writeText(roomCode);
  document.getElementById('displayCode').textContent = '✓ COPIED!';
  setTimeout(() => { document.getElementById('displayCode').textContent = roomCode; }, 1200);
}

// ═══════════════════════════════════════════════════
//  GAME START
// ═══════════════════════════════════════════════════
function startGame() {
  showScreen('game');
  setupMobileBtn();
  resetRound(true);
  startCountdown();
}

function resetRound(firstRound=false) {
  state.ropePos  = 0;
  state.blueHits = 0;
  state.redHits  = 0;
  state.timer    = ROUND_DURATION;
  hitRateWindow  = [];
  localHitRate   = 0;
  localHitsThisSecond = 0;
  if (!firstRound) state.round++;
  renderGameUI();
}

// ═══════════════════════════════════════════════════
//  COUNTDOWN
// ═══════════════════════════════════════════════════
function startCountdown() {
  const overlay = document.getElementById('countdownOverlay');
  const num     = document.getElementById('countdownNum');
  overlay.classList.remove('hidden');
  let c = 3;
  num.textContent = c;

  const iv = setInterval(() => {
    c--;
    if (c > 0) {
      num.textContent = c;
      num.style.animation = 'none';
      void num.offsetWidth;
      num.style.animation = 'countPop 0.4s ease-out';
    } else {
      clearInterval(iv);
      num.textContent = 'GO!';
      num.style.color = '#4AB4E8';
      setTimeout(() => {
        overlay.classList.add('hidden');
        num.style.color = 'white';
        beginRound();
      }, 700);
    }
  }, 900);
}

// ═══════════════════════════════════════════════════
//  ROUND LOGIC
// ═══════════════════════════════════════════════════
function beginRound() {
  state.phase = 'playing';
  roundStartTime = Date.now();
  if (timerInterval) clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    if (state.phase !== 'playing') return;
    state.timer--;
    updateTimerUI();
    if (state.timer <= 0) endRound();
  }, 1000);
}

function endRound() {
  if (state.phase !== 'playing') return;
  state.phase = 'roundEnd';
  clearInterval(timerInterval);

  let winner = null;
  if (state.ropePos < 0)      winner = 'blue';
  else if (state.ropePos > 0) winner = 'red';
  // tie → no one gets a point

  if (winner === 'blue') state.blueWins++;
  else if (winner === 'red')  state.redWins++;

  renderWinPips();

  const matchOver = state.blueWins >= ROUNDS_TO_WIN || state.redWins >= ROUNDS_TO_WIN;

  if (matchOver) {
    state.phase = 'matchEnd';
    showMatchEndOverlay(winner);
  } else {
    showRoundEndOverlay(winner);
  }
}

function showRoundEndOverlay(winner) {
  const emoji = winner === 'blue' ? '💙' : winner === 'red' ? '❤️' : '🤝';
  const title = winner ? (winner.toUpperCase() + ' WINS') : 'DRAW!';
  const sub   = `Round ${state.round} · Blue ${state.blueWins} – ${state.redWins} Red`;
  showOverlay(emoji, title, winner, sub, 'NEXT ROUND', false);
}

function showMatchEndOverlay(winner) {
  const emoji = winner ? '🏆' : '🤝';
  const title = winner ? (winner.toUpperCase() + ' WINS!') : 'IT\'S A DRAW!';
  const sub   = `Match over · Best of ${ROUNDS_TO_WIN*2-1}`;
  showOverlay(emoji, title, winner, sub, 'PLAY AGAIN', true);
}

function showOverlay(emoji, title, colorClass, sub, btnText, isMatch) {
  document.getElementById('overlayEmoji').textContent  = emoji;
  document.getElementById('overlayTitle').textContent  = title;
  document.getElementById('overlayTitle').className    = 'overlay-title ' + (colorClass || '');
  document.getElementById('overlaySub').textContent    = sub;
  document.getElementById('overlayBtn').textContent    = btnText;
  document.getElementById('overlayBtn').dataset.isMatch = isMatch ? '1' : '0';
  renderMatchPipsInOverlay();
  document.getElementById('overlay').classList.remove('hidden');
}

function overlayAction() {
  const isMatch = document.getElementById('overlayBtn').dataset.isMatch === '1';
  document.getElementById('overlay').classList.add('hidden');
  if (isMatch) {
    state.blueWins = 0; state.redWins = 0; state.round = 0;
  }
  resetRound(isMatch);
  renderWinPips();
  startCountdown();
}

// ═══════════════════════════════════════════════════
//  HIT HANDLING
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    registerHit();
  }
});

function registerHit() {
  if (state.phase !== 'playing') return;
  const now = Date.now();

  // Track hit rate (rolling 2s window)
  hitRateWindow.push(now);
  hitRateWindow = hitRateWindow.filter(t => now - t < 2000);
  localHitRate  = (hitRateWindow.length / 2).toFixed(1);

  // Update local state
  if (myRole === 'blue') {
    state.blueHits++;
    state.ropePos = Math.max(-ROPE_MAX, state.ropePos - PULL_STEP);
    showFlash('blue');
  } else {
    state.redHits++;
    state.ropePos = Math.min(ROPE_MAX, state.ropePos + PULL_STEP);
    showFlash('red');
  }

  // Broadcast hit
  channel.publish('gameMsg', {
    type: 'hit',
    role: myRole,
    ropePos: state.ropePos,
    hits: myRole === 'blue' ? state.blueHits : state.redHits,
    rate: localHitRate
  });

  renderGameUI();
  if (Math.abs(state.ropePos) >= ROPE_MAX) endRound();
}

function handleGameMsg(msg) {
  const d = msg.data;
  if (d.type === 'hit') {
    if (d.role === myRole) return; // our own echo
    state.ropePos = d.ropePos;
    if (d.role === 'blue') { state.blueHits = d.hits; }
    else                   { state.redHits  = d.hits; }
    // store opponent rate
    if (d.role !== myRole) {
      if (d.role === 'blue') document.getElementById('statsBlue').textContent = `${state.blueHits} hits · ${d.rate}/s`;
      else                   document.getElementById('statsRed').textContent  = `${state.redHits} hits · ${d.rate}/s`;
    }
    showFlash(d.role);
    renderGameUI();
    if (Math.abs(state.ropePos) >= ROPE_MAX) endRound();
  }
}

// ═══════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════
function renderGameUI() {
  // Names
  document.getElementById('nameBlue').textContent = lobbyState.blue || 'Blue';
  document.getElementById('nameRed').textContent  = lobbyState.red  || 'Red';

  // Scores (hit counts)
  document.getElementById('scoreBlue').textContent = state.blueHits;
  document.getElementById('scoreRed').textContent  = state.redHits;

  // My stats
  const myHits = myRole === 'blue' ? state.blueHits : state.redHits;
  const myStatEl = myRole === 'blue'
    ? document.getElementById('statsBlue')
    : document.getElementById('statsRed');
  myStatEl.textContent = `${myHits} hits · ${localHitRate}/s`;

  // Rope & anchor position
  renderRope();
  renderWinPips();
}

function renderRope() {
  const arena      = document.getElementById('arena');
  const arenaH     = arena.offsetHeight;
  const midH       = 80; // mid-zone height
  const fieldH     = (arenaH - midH) / 2;
  const midY       = fieldH; // top of mid-zone

  // Anchor horizontal offset
  const anchorEl   = document.getElementById('anchor');
  const anchorOffX = (state.ropePos / ROPE_MAX) * 60; // px
  anchorEl.style.marginLeft = (-18 + anchorOffX) + 'px';

  // Blue character: sits in top field, leaning toward rope
  const pullFraction = Math.max(-1, Math.min(1, -state.ropePos / ROPE_MAX));
  const blueY  = Math.max(0, fieldH * 0.15 + pullFraction * fieldH * 0.3);
  const charBlue = document.getElementById('charBlue');
  charBlue.style.bottom = (fieldH - blueY - 90) + 'px';

  const charRed = document.getElementById('charRed');
  charRed.style.top = (fieldH - blueY - 90) + 'px';

  // Rope SVG spanning from blue hands to red hands
  const ropeSvg = document.getElementById('ropeSvg');
  const topY    = blueY + 90 + 2; // blue hand
  const botY    = arenaH - blueY - 90 - 2; // red hand (mirror)
  const ropeLen = botY - topY;
  const segCount = Math.max(4, Math.floor(ropeLen / 18));

  ropeSvg.style.top  = topY + 'px';
  ropeSvg.style.height = ropeLen + 'px';
  ropeSvg.setAttribute('viewBox', `0 0 28 ${ropeLen}`);

  // Build twisted rope path
  let d1 = '', d2 = '';
  for (let i = 0; i <= segCount; i++) {
    const t   = i / segCount;
    const y   = t * ropeLen;
    const amp = 5;
    const x1  = 14 + amp * Math.sin(t * Math.PI * segCount * 0.7);
    const x2  = 14 - amp * Math.sin(t * Math.PI * segCount * 0.7);
    d1 += (i === 0 ? 'M' : 'L') + `${x1.toFixed(1)} ${y.toFixed(1)} `;
    d2 += (i === 0 ? 'M' : 'L') + `${x2.toFixed(1)} ${y.toFixed(1)} `;
  }

  ropeSvg.innerHTML = `
    <path d="${d1}" stroke="#D4893A" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="${d2}" stroke="#C06C1A" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="${d1}" stroke="#F5A84E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
  `;
}

function updateTimerUI() {
  const el = document.getElementById('timerDisplay');
  el.textContent = state.timer;
  el.className = 'timer-display' + (state.timer <= 5 ? ' urgent' : '');
}

function renderWinPips() {
  ['blue','red'].forEach(r => {
    const container = document.getElementById('wins' + r.charAt(0).toUpperCase() + r.slice(1));
    container.innerHTML = '';
    for (let i = 0; i < ROUNDS_TO_WIN; i++) {
      const pip = document.createElement('div');
      pip.className = 'win-pip' + (i < (r === 'blue' ? state.blueWins : state.redWins) ? ' filled' : '');
      container.appendChild(pip);
    }
  });
}

function renderMatchPipsInOverlay() {
  const c = document.getElementById('matchPips');
  c.innerHTML = '';
  for (let i = 0; i < ROUNDS_TO_WIN; i++) {
    const p = document.createElement('div');
    p.className = 'match-pip' + (i < state.blueWins ? ' blue' : '');
    c.appendChild(p);
  }
  for (let i = 0; i < ROUNDS_TO_WIN; i++) {
    const p = document.createElement('div');
    p.className = 'match-pip' + (i < state.redWins ? ' red' : '');
    c.appendChild(p);
  }
}

function showFlash(role) {
  const el = document.getElementById(role === 'blue' ? 'flashBlue' : 'flashRed');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 80);
}

// ═══════════════════════════════════════════════════
//  MOBILE SUPPORT
// ═══════════════════════════════════════════════════
function setupMobileBtn() {
  const btn = document.getElementById('mobileTapBtn');
  if (myRole === 'blue') {
    btn.style.background = 'var(--blue-player)';
    btn.textContent = 'PULL!';
    btn.style.display = 'flex';
  } else {
    btn.style.background = 'var(--red-player)';
    btn.textContent = 'PULL!';
    btn.style.display = 'flex';
  }
  btn.addEventListener('click', registerHit);
}

// ═══════════════════════════════════════════════════
//  RESIZE HANDLER
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => { if (state.phase === 'playing') renderRope(); });
</script>
</body>
</html>
